name: Publish

on:
  # Trigger: pushing a tag like `v0.1.2`, `v1.0.0`, etc.
  # The tag is created manually after the sync-spec PR (or any release PR)
  # is merged.
  push:
    tags: ['v*']

  # Manual trigger — for re-publishing after a hand-fix.
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: write      # for creating a GitHub release
      id-token: write      # npm trusted publishing (OIDC) and provenance

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Trusted publishing needs npm 11.5.1 or newer.
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify package version matches tag
        if: github.event_name == 'push'
        run: |
          PKG_VERSION=$(jq -r .version package.json)
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # No token: npm trusts this workflow (trusted publisher set up for
      # statuser-cloud/cli, publish.yml) and signs the provenance itself.
      - name: Publish to npm
        run: npm publish --access public --provenance

      - name: Create GitHub release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true


  binaries:
    needs: publish
    if: github.event_name == 'push'
    uses: ./.github/workflows/binaries.yml

  attach:
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Collect archives
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum statuser-* > SHA256SUMS

      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*

  verify-install:
    # The install scripts from this tag against the assets just attached:
    # asset names, SHA256SUMS and archive layout have to match what the
    # scripts expect, or a one-command install breaks for everyone.
    needs: attach
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install with install.sh
        if: runner.os != 'Windows'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          STATUSER_VERSION="$VERSION" STATUSER_INSTALL_DIR="$RUNNER_TEMP/bin" sh install.sh
          INSTALLED=$("$RUNNER_TEMP/bin/statuser" --version)
          if [ "$INSTALLED" != "$VERSION" ]; then
            echo "::error::installed statuser reports $INSTALLED, the tag is $VERSION"
            exit 1
          fi

      # Piped into Invoke-Expression, as `irm … | iex` runs it for users.
      - name: Install with install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $env:STATUSER_VERSION = $version
          $env:STATUSER_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'bin'
          Get-Content -Raw install.ps1 | Invoke-Expression
          $installed = & (Join-Path $env:STATUSER_INSTALL_DIR 'statuser.exe') --version
          if ($installed -ne $version) {
            Write-Output "::error::installed statuser reports $installed, the tag is $version"
            exit 1
          }

