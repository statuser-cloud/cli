name: CI

# The same gates publish.yml runs on a release, on every pull request, so a
# broken build shows up in review instead of on the tag. No secrets are used
# and the token is read-only: pull requests from forks run this too.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The lowest supported version and the current LTS.
        node: ['20.19.0', '22']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Smoke
        run: node dist/index.js --version

  binary:
    # The standalone executable bundles the CLI into one CommonJS file; a
    # top-level await or a runtime file read breaks it only there. The whole
    # suite runs against the built binary.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build the binary
        run: npx tsx scripts/build-binary.ts

      - name: Test the binary
        run: STATUSER_TEST_BINARY=build/statuser-linux-x64 npm test

  install-script:
    # install.sh is piped into whatever /bin/sh the user has, so it is parsed
    # by dash (ubuntu's sh) and linted as POSIX sh, not as bash.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Syntax
        run: sh -n install.sh

      - name: ShellCheck
        run: shellcheck install.sh

